# Dependabot keeps every dependency on its latest stable release. Minor and patch updates are grouped
# into one weekly PR per ecosystem; majors are left ungrouped, so each one gets its own PR to review.
# `cooldown` waits 3 days before proposing a new version; security updates skip it.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
    # services/api runs its tests in @cloudflare/vitest-pool-workers, which only supports Vitest 4.
    # Drop this once the pool supports the next major.
    ignore:
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        update-types: ['minor', 'patch']
