name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Job name is load-bearing: branch protection requires the check named
  # "CI (Lint, Test, Build)" — keep this exact name across any future changes
  # to this workflow, or PRs will block waiting on a check that never reports.
  verify:
    name: CI (Lint, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check generated Worker bindings are current
        # Catches vars added to services/api/wrangler.jsonc without regenerating
        # worker-configuration.d.ts (`pnpm --filter @pairflix/api cf-typegen`) -- see
        # docs/runbook.md's environment-variable drift note.
        run: pnpm --filter @pairflix/api exec wrangler types --check
