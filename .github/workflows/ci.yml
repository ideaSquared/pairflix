name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Job name is load-bearing: branch protection requires the check named
  # "CI (Lint, Test, Build)" — keep this exact name across any future changes
  # to this workflow, or PRs will block waiting on a check that never reports.
  verify:
    name: CI (Lint, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Dependabot bumps the shipper SHA in a `uses:` line but not the matching `shipper-ref:` input, so
      # a bump would run the new workflow with the old shipper scripts. Every uses: and every shipper-ref must be a
      # full SHA (no tags, no missing input) and all must match.
      - name: shipper pins match
        run: |
          refs=$(awk '
            function sha(v) { return length(v) == 40 && v ~ /^[0-9a-f]+$/ }
            function val(s) { sub(/^[^:]*:[[:space:]]*/, "", s); gsub(/["\047]/, "", s); sub(/[[:space:]].*$/, "", s); return s }
            function flush() { if (pend) { print "::error file=" pf "::a shipper call has no shipper-ref input" > "/dev/stderr"; bad = 1 } pend = 0 }
            FNR == 1 { flush() }
            /^[[:space:]]*#/ { next }
            /^  [A-Za-z0-9_-]+:[[:space:]]*$/ { flush() }
            /uses:[[:space:]]*["\047]?ideaSquared\/shipper\/\.github\/workflows\// {
              flush()
              r = $0; sub(/^.*@/, "", r); r = val("x:" r)
              if (!sha(r)) { print "::error file=" FILENAME "::shipper uses: must pin a full 40-hex SHA, found " r > "/dev/stderr"; bad = 1 }
              print r; pend = 1; pf = FILENAME; next
            }
            /^[[:space:]]+shipper-ref:/ {
              r = val($0)
              if (!sha(r)) { print "::error file=" FILENAME "::shipper-ref must be a full 40-hex SHA, found " r > "/dev/stderr"; bad = 1 }
              print r; pend = 0
            }
            END { flush(); exit bad }
          ' .github/workflows/*.y*ml) || exit 1
          if [ "$(printf '%s\n' "$refs" | sort -u | grep -c .)" -gt 1 ]; then
            echo "::error::Every shipper pin in .github/workflows (each uses: line and each shipper-ref input) must be the same commit SHA. Found: $(echo $refs)"
            exit 1
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Shipped migrations are not edited
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --diff-filter=MDR --name-only "origin/${BASE_REF}...HEAD" -- 'packages/db/migrations/*.sql')
          if [ -n "$changed" ]; then
            echo "Shipped migrations must not be modified, renamed or removed:"
            echo "$changed"
            exit 1
          fi

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check generated Worker bindings are current
        # Catches vars added to services/api/wrangler.jsonc without regenerating
        # worker-configuration.d.ts (`pnpm --filter @pairflix/api cf-typegen`) -- see
        # docs/runbook.md's environment-variable drift note.
        run: pnpm --filter @pairflix/api exec wrangler types --check

      - name: Dry-run deploy of every Worker
        run: |
          pnpm --filter @pairflix/api exec wrangler deploy --dry-run --env staging --outdir "$RUNNER_TEMP/api-staging"
          pnpm --filter @pairflix/api exec wrangler deploy --dry-run --env production --outdir "$RUNNER_TEMP/api-production"
          pnpm --filter @pairflix/client exec wrangler deploy --dry-run --env staging
          pnpm --filter @pairflix/admin exec wrangler deploy --dry-run --env staging
