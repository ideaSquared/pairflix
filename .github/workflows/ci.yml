name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single verification job, mirroring creatorgrid's CI. Formatting is checked by a
  # standalone `prettier --check` (format:check), NOT eslint-plugin-prettier — running
  # Prettier as an ESLint rule is what caused the lint/format version drift the old
  # split workflows kept fighting.
  verify:
    name: CI (Lint, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build component library
        run: npm run build:components

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint:all

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test:all

      - name: Build
        run: npm run build:all
