# `ship deploy pairflix <staging|production>` (or Actions -> Deploy -> Run workflow) starts this. It
# deploys master's head through ideaSquared/shipper: the gate reads the checks that ran on the
# commit's push, production requires the commit to be live on staging first, then shipper builds,
# applies D1 migrations, deploys each component in ship.yaml and health-checks it.
#
# workflow_dispatch ONLY -- deliberately not wired to push/merge, because none of the following
# exist yet (see docs/runbook.md for the full first-deploy procedure):
#
#   - A Cloudflare account for this project, with Workers and D1 enabled.
#   - Real D1 databases (`wrangler d1 create pairflix-db-staging` / `pairflix-db-production`), with
#     their ids substituted for the placeholder `database_id`s in services/api/wrangler.jsonc's
#     `env.staging` / `env.production` blocks.
#   - Real `ALLOWED_ORIGINS` values in those same blocks, once apps/client has real domain(s).
#   - The `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID` secrets, set on the matching GitHub
#     Environment ("staging" / "production").
#   - Every Worker secret `wrangler secret put` needs per environment -- see docs/runbook.md.
#
# Running this workflow before that is done will fail (auth or "database not found") -- expected.
# See docs/runbook.md's "Cross-site cookies" section before assuming a post-deploy 401/403 is a bug.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy master to
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      checks: read
      deployments: write
    uses: ideaSquared/shipper/.github/workflows/deploy.yml@7839bde2edef52a5e58107bbf83e9b9760d7d52a # v1.0.0
    with:
      environment: ${{ inputs.environment }}
      shipper-ref: 7839bde2edef52a5e58107bbf83e9b9760d7d52a
    secrets: inherit
